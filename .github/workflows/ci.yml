name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Test Python and browser scripts
        run: |
          python -m unittest discover -s tests -v
          for test in tests/test_*.mjs; do node "$test"; done
          node --check app/static/app.js
      - name: Package source
        run: |
          version="$(python tools/package_image.py --version)"
          echo "CLOUDRIFT_VERSION=$version" >> "$GITHUB_ENV"
          python tools/package_image.py --source-only
      - name: Build clean Linux amd64 image
        run: docker compose build
      - name: Verify fresh container startup
        run: |
          docker compose up -d --no-build
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8090/health > /tmp/health.json &&
              python -c 'import json, os; d=json.load(open("/tmp/health.json")); assert d["status"] == "ok" and d["core_ready"] and d["worker_alive"] and d["version"] == os.environ["CLOUDRIFT_VERSION"]'; then
              cat /tmp/health.json
              curl --fail --silent http://127.0.0.1:8090/ > /tmp/index.html
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Save installation image
        shell: bash
        if: github.event_name != 'pull_request'
        run: |
          release="cloudrift-v${CLOUDRIFT_VERSION}"
          docker save "cloudrift:$CLOUDRIFT_VERSION" | gzip > "dist/$release-linux-amd64.tar.gz"
          cd dist
          sha256sum "$release-source.zip" "$release-files.sha256" douyin-send.user.js "$release-linux-amd64.tar.gz" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cloudrift-installation
          path: dist/
          retention-days: 7
          compression-level: 0
      - name: Stop test container
        if: always()
        run: docker compose down
