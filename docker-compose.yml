services:
  douyin-library:
    image: cloudrift:1.4.0
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8090"
    environment:
      APP_TOKEN: "${APP_TOKEN:-}"
      APP_DATA: /data
      APP_MEDIA: /media
      APP_CORE: /app/vendor/TikTokDownloader
      TZ: Asia/Taipei
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
      - ${APP_MEDIA_DIR:-./media}:/media
    stop_grace_period: 30s
